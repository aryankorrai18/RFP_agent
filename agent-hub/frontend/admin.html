<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Hub admin</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  color-scheme: light;
  --canvas: #f5f5f7; --surface: #ffffff; --sunk: #f9f9fb;
  --fill: #e8e8ed; --fill-2: #f2f2f4; --fill-hover: #dcdce1;
  --ink: #1d1d1f; --ink-2: #424245; --muted: #6e6e73; --ink-3: #86868b;
  --hair: rgba(0, 0, 0, .08); --line: #d2d2d7;
  --accent: #0071e3; --accent-hover: #0077ed; --link: #0066cc; --accent-soft: rgba(0, 113, 227, .09);
  --ok: #1d7f3a; --warn: #b64400; --bad: #d70015; --violet: #8944ab;
  --ok-soft: rgba(36, 138, 61, .1); --warn-soft: rgba(182, 68, 0, .09); --bad-soft: rgba(215, 0, 21, .07); --violet-soft: rgba(137, 68, 171, .1);
  --nav: rgba(245, 245, 247, .8); --tile-dark: #1d1d1f; --sheen: rgba(255, 255, 255, .75);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .03), 0 2px 8px rgba(0, 0, 0, .04);
  --shadow: 0 2px 6px rgba(0, 0, 0, .03), 0 8px 24px rgba(0, 0, 0, .06);
  --shadow-lg: 0 6px 16px rgba(0, 0, 0, .06), 0 20px 44px rgba(0, 0, 0, .1);
  --ring: 0 0 0 4px rgba(0, 113, 227, .16);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  --mark: radial-gradient(circle at 32% 32%, #fff 0 3.4px, transparent 4px), radial-gradient(circle at 68% 68%, rgba(255, 255, 255, .62) 0 3.4px, transparent 4px), linear-gradient(150deg, #3d9cff, #0060cc);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark; --canvas: #000000; --surface: #1c1c1e; --sunk: #161618;
    --fill: #2c2c2e; --fill-2: #232325; --fill-hover: #3a3a3c;
    --ink: #f5f5f7; --ink-2: #d2d2d7; --muted: #a1a1a6; --ink-3: #86868b; --hair: rgba(255, 255, 255, .09); --line: #424245;
    --accent: #0071e3; --accent-hover: #0a7cf0; --link: #2997ff; --accent-soft: rgba(41, 151, 255, .15);
    --ok: #30d158; --warn: #ff9f0a; --bad: #ff453a; --violet: #bf5af2;
    --ok-soft: rgba(48, 209, 88, .14); --warn-soft: rgba(255, 159, 10, .14); --bad-soft: rgba(255, 69, 58, .14); --violet-soft: rgba(191, 90, 242, .16);
    --nav: rgba(16, 16, 17, .72); --tile-dark: #2c2c2e; --sheen: rgba(255, 255, 255, .07);
    --shadow-sm: 0 0 0 1px rgba(255, 255, 255, .02); --shadow: 0 10px 30px rgba(0, 0, 0, .45); --shadow-lg: 0 20px 50px rgba(0, 0, 0, .65);
    --ring: 0 0 0 4px rgba(41, 151, 255, .25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark; --canvas: #000000; --surface: #1c1c1e; --sunk: #161618;
  --fill: #2c2c2e; --fill-2: #232325; --fill-hover: #3a3a3c;
  --ink: #f5f5f7; --ink-2: #d2d2d7; --muted: #a1a1a6; --ink-3: #86868b; --hair: rgba(255, 255, 255, .09); --line: #424245;
  --accent: #0071e3; --accent-hover: #0a7cf0; --link: #2997ff; --accent-soft: rgba(41, 151, 255, .15);
  --ok: #30d158; --warn: #ff9f0a; --bad: #ff453a; --violet: #bf5af2;
  --ok-soft: rgba(48, 209, 88, .14); --warn-soft: rgba(255, 159, 10, .14); --bad-soft: rgba(255, 69, 58, .14); --violet-soft: rgba(191, 90, 242, .16);
  --nav: rgba(16, 16, 17, .72); --tile-dark: #2c2c2e; --sheen: rgba(255, 255, 255, .07);
  --shadow-sm: 0 0 0 1px rgba(255, 255, 255, .02); --shadow: 0 10px 30px rgba(0, 0, 0, .45); --shadow-lg: 0 20px 50px rgba(0, 0, 0, .65);
  --ring: 0 0 0 4px rgba(41, 151, 255, .25);
}
* { box-sizing: border-box; }
html { scroll-padding-top: 120px; }
body { margin: 0; background: var(--canvas); color: var(--ink); font: 15px/1.5 var(--font); letter-spacing: -.003em; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; overflow-wrap: anywhere; }
button, input, select { font: inherit; letter-spacing: inherit; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
[hidden] { display: none !important; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg { flex: none; }

/* ---------- navigation ---------- */
.nav { position: sticky; top: 0; z-index: 20; background: var(--nav); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--hair); }
.nav-in { max-width: 1160px; margin: 0 auto; padding: 0 24px; height: 52px; display: flex; align-items: center; gap: 10px; }
.brand { display: inline-flex; align-items: center; gap: 9px; font-weight: 700; font-size: 16px; letter-spacing: -.02em; color: var(--ink); }
.brand:hover { text-decoration: none; }
.mark { width: 26px; height: 26px; border-radius: 8px; background: var(--mark); flex: none; }
.navsep { width: 1px; height: 18px; background: var(--hair); margin: 0 4px; }
.navtitle { font-size: 14px; color: var(--muted); font-weight: 500; white-space: nowrap; }
.subnav { border-top: 1px solid var(--hair); }
.subnav .nav-in { height: 48px; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.subnav .nav-in::-webkit-scrollbar { display: none; }
.subnav strong { font-size: 19px; font-weight: 600; letter-spacing: -.02em; margin-right: auto; white-space: nowrap; padding-right: 16px; }
.subnav a { font-size: 13px; color: var(--ink-2); padding: 5px 11px; border-radius: 999px; white-space: nowrap; }
.subnav a:hover { background: var(--fill); text-decoration: none; }
.spacer { flex: 1; }
.chip { font-size: 12.5px; color: var(--ink-2); border: 1px solid var(--hair); border-radius: 999px; padding: 3px 11px; background: var(--fill-2); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.chip.on { color: var(--link); background: var(--accent-soft); border-color: transparent; }
.chip.off { color: var(--warn); }
.tlink { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; padding: 6px 13px; border-radius: 999px; background: transparent; color: var(--ink); border: 0; cursor: pointer; white-space: nowrap; }
.tlink:hover { background: var(--fill); text-decoration: none; }
.icon-btn { width: 34px; height: 34px; border-radius: 50%; border: 0; background: transparent; color: var(--ink-2); display: inline-grid; place-items: center; padding: 0; flex: none; cursor: pointer; }
.icon-btn:hover { background: var(--fill); }
.icon-btn svg, .tlink svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tlink svg { width: 15px; height: 15px; }

/* ---------- layout ---------- */
main { max-width: 1160px; margin: 0 auto; padding: 44px 24px 96px; display: grid; gap: 64px; min-width: 0; }
.section { display: grid; gap: 18px; min-width: 0; scroll-margin-top: 120px; }
.display { margin: 0; font-size: clamp(32px, 4.2vw, 52px); line-height: 1.06; letter-spacing: -.032em; font-weight: 700; max-width: 920px; }
.display .g, .shead h2 .g { color: var(--ink-3); }
.shead { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.shead h2 { margin: 0; font-size: clamp(24px, 2.6vw, 32px); line-height: 1.12; letter-spacing: -.026em; font-weight: 700; flex: 1 1 420px; min-width: 0; }
.shead .chip { margin-bottom: 4px; }
.shead .btn { margin-bottom: 2px; }
.kicker { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.panel, .card { background: var(--surface); border: 1px solid var(--hair); border-radius: 22px; box-shadow: var(--shadow-sm); padding: 20px 22px; display: grid; gap: 14px; min-width: 0; }
.panel.flush { padding: 0; overflow: hidden; gap: 0; }
.card h2 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
.hint { color: var(--muted); font-size: 14px; margin: 0; max-width: 820px; }
.hint.small, .small { font-size: 12.5px; }
.dim { color: var(--muted); } .bad { color: var(--bad); } .ok { color: var(--ok); }
.nowrap { white-space: nowrap; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.empty { color: var(--muted); padding: 10px 2px; }
.center { max-width: 560px; margin: 56px auto 0; width: 100%; padding: 32px 32px 28px; border-radius: 28px; box-shadow: var(--shadow-lg); gap: 16px; }
.center h2 { font-size: 30px; line-height: 1.1; letter-spacing: -.028em; margin: 0; }
.center h2 .g { color: var(--ink-3); }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 500; min-height: 36px; padding: 6px 17px; border-radius: 980px; border: 1px solid transparent; background: var(--accent); color: #fff; cursor: pointer; line-height: 1.2; white-space: nowrap; transition: background .15s, transform .15s, opacity .15s; }
.btn:not(:disabled):hover { background: var(--accent-hover); }
.btn:not(:disabled):active { transform: scale(.98); }
.btn:disabled { opacity: .42; cursor: default; }
.btn.ghost { background: var(--fill); color: var(--ink); }
.btn.ghost:not(:disabled):hover { background: var(--fill-hover); }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.danger:not(:disabled):hover { background: color-mix(in srgb, var(--bad) 16%, transparent); }
.btn.small { min-height: 30px; padding: 4px 13px; font-size: 13px; }
input[type=text], input[type=email], input[type=password], input[type=search], select {
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 11px; min-height: 40px; padding: 7px 12px; width: 100%; min-width: 0; font-size: 14.5px; transition: border-color .15s, box-shadow .15s; }
input:focus, select:focus { outline: 0; border-color: var(--accent); box-shadow: var(--ring); }
input:disabled { color: var(--muted); background: var(--fill-2); }
input[type=search] { border-radius: 999px; padding-left: 16px; }
input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); flex: none; margin: 3px 0 0; }
input.find, select.find { width: 240px; max-width: 100%; }
label.f { display: grid; gap: 6px; font-size: 13px; color: var(--ink-2); font-weight: 500; min-width: 0; }
form.box, .box { border: 1px solid var(--hair); border-radius: 20px; padding: 20px; display: grid; gap: 14px; background: var(--surface); box-shadow: var(--shadow); min-width: 0; }
form.box > strong, .box > strong { font-size: 17px; letter-spacing: -.015em; }
.grid2 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.picker { display: grid; gap: 6px; border: 1px solid var(--hair); border-radius: 14px; padding: 12px 14px; background: var(--sunk); max-height: 220px; overflow: auto; min-width: 0; }
.picker .ptitle { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 2px; }
.picker label { display: flex; gap: 9px; align-items: flex-start; font-size: 14px; color: var(--ink); }
.picker small { color: var(--muted); font-size: 12.5px; }
details.adv { border: 1px solid var(--hair); border-radius: 14px; padding: 10px 14px; background: var(--sunk); }
details.adv summary { cursor: pointer; font-size: 14px; color: var(--ink-2); font-weight: 500; }
details.adv[open] { display: grid; gap: 12px; }
#note { position: fixed; top: 112px; left: 50%; transform: translateX(-50%); z-index: 40; max-width: min(92vw, 640px); padding: 11px 20px; border-radius: 999px; background: var(--ink); color: var(--canvas); box-shadow: var(--shadow-lg); font-size: 14px; font-weight: 500; animation: drop .25s cubic-bezier(.2, .7, .2, 1); }
#note.err { background: var(--bad); color: #fff; }
#note.ok::before { content: "\2713  "; color: var(--ok); font-weight: 700; }

/* ---------- overview ---------- */
.lede { margin: -4px 0 0; font-size: 18px; color: var(--muted); max-width: 680px; letter-spacing: -.012em; }
.tiles { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(176px, 1fr)); }
.tile { border: 1px solid var(--hair); border-radius: 20px; padding: 18px 20px 16px; background: var(--surface); box-shadow: var(--shadow-sm); min-width: 0; display: grid; gap: 2px; transition: transform .25s cubic-bezier(.2, .7, .2, 1), box-shadow .25s; }
.tile:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.tile:first-child { background: var(--tile-dark); color: #f5f5f7; border-color: transparent; }
.tile:first-child .tlabel, .tile:first-child .tsub { color: #a1a1a6; }
.tlabel { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.tvalue { font-size: 34px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.15; margin: 6px 0 2px; }
.tsub { font-size: 13px; }
.explain { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr); align-items: stretch; gap: 10px; }
.explain .step { display: grid; gap: 8px; align-content: start; min-width: 0; font-size: 14px; background: var(--surface); border: 1px solid var(--hair); border-radius: 20px; padding: 18px 20px; box-shadow: var(--shadow-sm); }
.explain .step strong { font-size: 16px; letter-spacing: -.014em; display: block; }
.explain .num { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--link); font-weight: 700; display: grid; place-items: center; font-size: 13px; }
.explain .step:nth-child(3) .num { background: var(--warn-soft); color: var(--warn); }
.explain .step:nth-child(5) .num { background: var(--violet-soft); color: var(--violet); }
.explain .arrow { color: var(--ink-3); font-size: 20px; align-self: center; }
.explain .opnote { grid-column: 1 / -1; font-size: 14px; padding: 4px 4px 0; }
.callout { display: flex; gap: 10px; align-items: center; padding: 12px 18px; border-radius: 16px; background: var(--warn-soft); color: var(--warn); font-size: 14px; font-weight: 500; }
.callout p { margin: 0; color: inherit; }
.notices { display: grid; gap: 8px; }

/* ---------- companies ---------- */
.companies { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); align-items: start; }
.companies > form.box, .companies > .row, .companies > .empty, .company.wide { grid-column: 1 / -1; }
.company { border: 1px solid var(--hair); border-radius: 22px; padding: 20px 22px 18px; display: grid; gap: 16px; background: var(--surface); box-shadow: var(--shadow-sm); min-width: 0; transition: transform .25s cubic-bezier(.2, .7, .2, 1), box-shadow .25s; }
.company:not(.wide):hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.chead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.cname { font-size: 19px; font-weight: 700; letter-spacing: -.02em; }
.datalist { display: grid; gap: 0; }
.datarow { display: grid; gap: 2px; font-size: 14px; padding: 10px 0; border-top: 1px solid var(--hair); }
.datarow:first-child { border-top: 0; padding-top: 0; }
.datarow .app { color: var(--muted); font-weight: 600; font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; }
.datarow .state { min-width: 0; overflow-wrap: anywhere; }
.cfoot { display: flex; gap: 6px; flex-wrap: wrap; padding-top: 2px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
.ok-dot { background: var(--ok); } .warn-dot { background: var(--warn); }
.warnstate, .warntext { color: var(--warn); }
.actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }

/* ---------- tables ---------- */
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; padding: 14px 16px 10px; border-bottom: 1px solid var(--hair); white-space: nowrap; background: var(--surface); }
td { padding: 13px 16px; border-bottom: 1px solid var(--hair); vertical-align: top; }
th:first-child, td:first-child { padding-left: 22px; } th:last-child, td:last-child { padding-right: 22px; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:not(.detail):hover td { background: var(--sunk); }
td[colspan] { background: var(--sunk); }
td[colspan] > .box { box-shadow: none; }
table.usage td.num, table.usage th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.linkish { font: inherit; font-weight: 600; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; display: inline-flex; align-items: baseline; }
.linkish:hover { color: var(--link); }
.caret { display: inline-block; width: 1.2em; color: var(--muted); font-size: 12px; }
tr.detail td { background: var(--sunk); }
.parts { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 13.5px; font-variant-numeric: tabular-nums; padding-left: 1.2em; }
.pbar { display: flex; align-items: center; gap: 14px; padding: 16px 22px; border-bottom: 1px solid var(--hair); flex-wrap: wrap; }
.pbar strong { font-size: 15px; }
.pfoot { padding: 12px 22px; border-top: 1px solid var(--hair); }
.badge { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 10px; color: var(--muted); background: var(--fill-2); white-space: nowrap; }
.badge.admin { color: var(--link); background: var(--accent-soft); }
.badge.on { color: var(--ok); background: var(--ok-soft); } .badge.off { color: var(--bad); background: var(--bad-soft); } .badge.warn { color: var(--warn); background: var(--warn-soft); }
.badge.you { margin-left: 8px; color: var(--link); background: var(--accent-soft); }
.tags { display: flex; gap: 5px; flex-wrap: wrap; }
.tag { font: 500 12px var(--mono); background: var(--accent-soft); color: var(--link); border-radius: 6px; padding: 1px 7px; }

/* ---------- security ---------- */
.verdict { border-radius: 22px; padding: 22px 24px; font-size: 19px; font-weight: 600; letter-spacing: -.016em; line-height: 1.35; background: var(--surface); border: 1px solid var(--hair); box-shadow: var(--shadow-sm); display: grid; gap: 6px; }
.verdict::before { content: "Not checked"; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.verdict.on::before { content: "All clear"; color: var(--ok); }
.verdict.warn::before { content: "Heads up"; color: var(--warn); }
.verdict.off::before { content: "Action needed"; color: var(--bad); }
.verdict.off { background: color-mix(in srgb, var(--bad) 6%, var(--surface)); }
.secrows { display: grid; gap: 0; }
.secrow { display: grid; grid-template-columns: 190px auto 1fr; gap: 14px; align-items: baseline; font-size: 14px; padding: 12px 0; border-top: 1px solid var(--hair); }
.secrow:first-child { border-top: 0; padding-top: 0; } .secrow:last-child { padding-bottom: 0; }
.mono, pre.code, code { font-family: var(--mono); }
input.mono { width: 36em; max-width: 100%; font-size: 13px; }
pre.code { margin: 4px 0 8px; padding: 10px 14px; border-radius: 12px; background: var(--sunk); border: 1px solid var(--hair); font-size: 12.5px; overflow-x: auto; white-space: pre; }
code { font-size: 12.5px; background: var(--fill-2); border: 1px solid var(--hair); border-radius: 6px; padding: 1px 6px; }
.steps { display: grid; gap: 16px; } .lock { display: grid; gap: 4px; font-size: 14px; }
ul.hint { margin: 0; padding-left: 20px; display: grid; gap: 4px; }

/* ---------- loading, slow and busy states ---------- */
.topprog { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 100; pointer-events: none; opacity: 0; transition: opacity .3s; }
.topprog > i { display: block; height: 100%; width: 0; background: var(--accent); box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 60%, transparent); border-radius: 0 3px 3px 0; }
.topprog.on { opacity: 1; }
.topprog.on > i { width: 85%; transition: width 8s cubic-bezier(.1, .7, .2, 1); }
.topprog.done { opacity: 0; transition: opacity .35s .15s; }
.topprog.done > i { width: 100%; transition: width .15s; }
.sk { display: block; border-radius: 7px; background-color: var(--fill); background-image: linear-gradient(90deg, transparent 0, var(--sheen) 50%, transparent 100%); background-size: 50% 100%; background-repeat: no-repeat; animation: shimmer 1.5s ease-in-out infinite; }
.sk-line { height: 11px; } .sk-line.sm { height: 9px; } .sk-line.xl { height: clamp(30px, 3.6vw, 46px); border-radius: 12px; } .sk-line.num { height: 30px; border-radius: 9px; }
.w20 { width: 20%; } .w30 { width: 30%; } .w40 { width: 40%; } .w50 { width: 50%; } .w60 { width: 60%; } .w70 { width: 70%; } .w80 { width: 80%; }
.skeleton { display: grid; gap: 22px; }
.skeleton .tile { gap: 12px; }
.skeleton .tile:first-child { background: var(--surface); border-color: var(--hair); }
.sk-rows { display: grid; }
.sk-rows > div { display: grid; grid-template-columns: 1.4fr 1fr .8fr .8fr; gap: 24px; padding: 16px 22px; border-top: 1px solid var(--hair); }

}
(async function boot() {
  const stopSlow = slowWatch($("slowboot"), ["Still loading...", "The hub is busy. I'll keep trying."]);
  let me;
  try { me = await whoAmI(); } catch (e) { stopSlow(); return renderNotice("Can't reach the hub", `${e.message} Reload the page to try again.`); }
  if (me.auth !== "on") {
    if (me.setup_available) return renderSetup();
    return renderNotice("Sign-in isn't turned on", me.setup_available === false && me.auth === "off"
      ? "Setup can only be done from the computer the hub runs on, and only before the first account exists. If sign-in was switched off with HUB_AUTH=off, remove that setting."
      : "", { href: "/", text: "Back to the chat" });
  }
  if (!me.user) { stopSlow(); renderSignIn(""); return; }
  $("who").hidden = $("signout").hidden = false;
  $("who").textContent = `${me.user.name || me.user.email} | ${me.user.company}`;
  if (me.user.role !== "admin") return renderNotice("Administrators only", "Your account can use the chat but not this page. Ask an administrator.", { href: "/", text: "Back to the chat" });
  try { await loadWithRetry(); } catch (e) { renderNotice("Couldn't load", e.message); } finally { stopSlow(); }
})();
</script>
</body>
