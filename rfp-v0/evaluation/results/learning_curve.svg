<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="920" height="360" role="img" aria-label="Does it learn? Right answer first as review history accumulates" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
